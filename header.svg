<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" width="100%" role="img" aria-label="Agatha Ignacio - Front-end" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFE4EC"/>
      <stop offset="1" stop-color="#FFFFFF"/>
    </linearGradient>
    <linearGradient id="pink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFC0D9"/>
      <stop offset="1" stop-color="#FF4F9A"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.6" fill="#FF69B4" opacity=".35"/>
    </pattern>
  </defs>

  <!-- fundo -->
  <rect width="1000" height="330" rx="28" fill="url(#bg)"/>
  <rect width="1000" height="330" rx="28" fill="url(#dots)"/>

  <!-- sombra rosa da janela -->
  <rect x="72" y="54" width="880" height="250" rx="20" fill="#FF69B4" opacity=".55"/>

  <!-- janela -->
  <rect x="60" y="40" width="880" height="250" rx="20" fill="#0D0D0D"/>
  <path d="M60 60 a20 20 0 0 1 20 -20 h840 a20 20 0 0 1 20 20 v28 h-880 z" fill="#1A1A1A"/>
  <circle cx="92" cy="64" r="7" fill="#FF4F9A"/>
  <circle cx="116" cy="64" r="7" fill="#FFC0D9"/>
  <circle cx="140" cy="64" r="7" fill="#FFFFFF"/>
  <text x="500" y="69" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#FF9CC8" opacity=".8">agatha.html</text>

  <!-- texto -->
  <text x="110" y="128" font-family="Consolas, 'Courier New', monospace" font-size="15" fill="#FF69B4">&lt;h1&gt;</text>
  <text x="110" y="190" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="56" font-weight="700" fill="#FFFFFF">Agatha Ignacio</text>
  <text x="112" y="224" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" letter-spacing="1.5" fill="#FF8DC3">Front-end ✦ Interfaces bonitas e acessíveis</text>
  <text x="110" y="262" font-family="Consolas, 'Courier New', monospace" font-size="16" fill="#FFFFFF" textLength="384" lengthAdjust="spacingAndGlyphs">&gt; if (layout !== alinhado) sono = false;</text>
  <rect x="500" y="248" width="10" height="19" fill="#FF69B4">
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.49;0.5;0.99;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>

  <!-- selo à direita -->
  <circle cx="815" cy="170" r="78" fill="none" stroke="#FF69B4" stroke-width="2" stroke-dasharray="4 8" opacity=".7">
    <animateTransform attributeName="transform" type="rotate" from="0 815 170" to="360 815 170" dur="30s" repeatCount="indefinite"/>
  </circle>
  <circle cx="815" cy="170" r="60" fill="url(#pink)">
    <animate attributeName="r" values="60;64;60" dur="3s" repeatCount="indefinite"/>
  </circle>
  <text x="815" y="184" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="40" font-weight="700" fill="#0D0D0D">&lt;/&gt;</text>

  <!-- corações flutuando -->
  <g font-family="Arial, sans-serif" fill="#FF69B4">
    <text x="905" y="130" font-size="20" opacity="0"><animate attributeName="opacity" values="0;.9;0" dur="4s" repeatCount="indefinite"/><animate attributeName="y" values="150;100" dur="4s" repeatCount="indefinite"/>♥</text>
    <text x="720" y="110" font-size="14" fill="#FFC0D9" opacity="0"><animate attributeName="opacity" values="0;.9;0" dur="5s" begin="1s" repeatCount="indefinite"/><animate attributeName="y" values="130;90" dur="5s" begin="1s" repeatCount="indefinite"/>♥</text>
    <text x="890" y="250" font-size="16" fill="#FFFFFF" opacity="0"><animate attributeName="opacity" values="0;.8;0" dur="4.5s" begin="2s" repeatCount="indefinite"/><animate attributeName="y" values="270;225" dur="4.5s" begin="2s" repeatCount="indefinite"/>♥</text>
    <text x="30" y="300" font-size="22" opacity=".8">♥</text>
    <text x="962" y="48" font-size="18" fill="#FF4F9A" opacity=".8">♥</text>
  </g>
</svg>
